<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="간단한 단어 카드 학습 앱 — 본문을 넣으면 단어 카드를 만들어 줍니다.">
  <meta name="theme-color" content="#1A1D29">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ankiyo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ankiyo</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #1A1D29;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard",
        "Noto Sans KR", system-ui, sans-serif;
    }
    #ankiyo-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1A1D29;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    #ankiyo-splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    #ankiyo-splash .mark {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    #ankiyo-splash .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.35);
      animation: ankiyo-pulse 1.4s infinite ease-in-out;
    }
    #ankiyo-splash .wordmark {
      color: #ffffff;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -1px;
    }
    @keyframes ankiyo-pulse {
      0%, 100% { transform: scale(0.85); opacity: 0.55; }
      50%      { transform: scale(1.15); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="ankiyo-splash">
    <div class="mark">
      <div class="dot"></div>
      <div class="wordmark">ankiyo</div>
    </div>
  </div>

  <script>
    // Flutter가 첫 프레임 그리면 스플래시 페이드 아웃.
    function hideAnkiyoSplash() {
      var el = document.getElementById('ankiyo-splash');
      if (!el) return;
      el.classList.add('hide');
      setTimeout(function () { el.remove(); }, 400);
    }
    window.addEventListener('flutter-first-frame', hideAnkiyoSplash);
    // 안전망: 8초 안에 first-frame 이벤트 못 받으면 강제로 내림.
    setTimeout(hideAnkiyoSplash, 8000);
  </script>

  <script>
    // 기존에 등록된 service worker를 해제하고 캐시를 비운다.
    // (잦은 배포 중 옛 JS가 캐시되어 신버전이 안 뜨는 문제 방지)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) {
        keys.forEach(function (k) { caches.delete(k); });
      }).catch(function () {});
    }
  </script>

  <!-- Flutter SW 자동등록 비활성화: 항상 최신 코드 로드 -->
  <script>
    window._flutter = window._flutter || {};
    window._flutter.loader = window._flutter.loader || {};
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
